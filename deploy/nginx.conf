limit_req_zone $binary_remote_addr zone=mantenimiento_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mantenimiento_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/mantenimiento/frontend/dist;
    index index.html;
    client_max_body_size 110M;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 120s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn mantenimiento_conn 20;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        expires -1;
    }

    location /api/ {
        limit_req zone=mantenimiento_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Debe pasar por Node: el backend valida sesion y permisos por archivo.
    location /uploads/ {
        # Las galerías de inspección piden muchas fotos a la vez.
        limit_req zone=mantenimiento_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
